            - generic [ref=f2e250]:
              - img "Diagram showing two containers (blue and orange) each with a writable layer on top, built on their respective image layers (Debian+emacs+Apache and BusyBox), all sharing the same host kernel at the base." [ref=f2e251]
              - paragraph [ref=f2e252]: Two containers sharing the host kernel — each has its own image layers and a thin writable layer on top. Changes written at runtime go into the writable layer only; the image layers beneath are never modified.
            - generic [ref=f2e254]:
              - 'img "Three-step diagram showing how each Dockerfile instruction builds a new layer: FROM debian produces the base layer, RUN apt-get install emacs adds an emacs layer on top, and RUN apt-get install apache2 adds an apache2 layer on top of that." [ref=f2e255]'
              - paragraph [ref=f2e256]: Each Dockerfile instruction that modifies the filesystem adds a new read-only layer — FROM creates the base, each RUN stacks on top. This is the image you distribute.
            - generic [ref=f2e257]:
              - paragraph [ref=f2e258]:
                - text: Every container image is made up of a stack of read-only
                - strong [ref=f2e259]: layers
                - text: . Each instruction in your Dockerfile that modifies the filesystem (
                - code [ref=f2e260]: RUN
                - text: ","
                - code [ref=f2e261]: COPY
                - text: ","
                - code [ref=f2e262]: ADD
                - text: ) produces a new layer. Layers are identified by a content hash (SHA256), so if the layer content hasn't changed, Docker reuses the cached version. This is what makes incremental builds fast.
              - paragraph [ref=f2e263]:
                - text: The technology that makes this possible is called a
                - strong [ref=f2e264]: Union File System
                - text: — most commonly OverlayFS on modern Linux kernels. UnionFS merges multiple directory trees into a single coherent view. You see one flat filesystem, but underneath it is a stack of layers where upper layers can shadow (override) files in lower layers without modifying them.
              - paragraph [ref=f2e265]:
                - text: When you run a container, Docker adds one final
                - strong [ref=f2e266]: writable layer
                - text: on top of all the read-only image layers. Any files the container creates or modifies are written into this top layer only. When the container is stopped and deleted, that writable layer is discarded. The underlying image layers are never changed — this is what makes containers
                - strong [ref=f2e267]: immutable
                - text: at the image level.
              - paragraph [ref=f2e268]:
                - strong [ref=f2e269]: Copy-on-Write (CoW)
                - text: is the mechanism that makes this efficient. When a running container needs to modify a file that exists in a lower read-only layer, the Union File System does not touch that layer. Instead it
                - emphasis [ref=f2e270]: copies
                - text: the file up into the writable layer first, then modifies the copy there. The original in the read-only layer is untouched. This means two containers from the same image share all the read-only layers in memory and on disk — only their small writable layers differ.
              - paragraph [ref=f2e271]:
                - text: The practical consequence for you as a developer is that
                - strong [ref=f2e272]: the order of instructions in your Dockerfile directly controls your build cache
                - text: . Instructions that change rarely (installing OS packages, copying
                - code [ref=f2e273]: package.json
                - text: ) should come first. Instructions that change frequently (copying your source code) should come last. This way a source code change only invalidates the last few layers, and earlier layers are served from cache in seconds.
            - generic [ref=f2e275]:
              - 'img "Diagram illustrating Copy-on-Write: a file from a read-only image layer is copied up into the writable container layer before being modified, leaving the original layer unchanged." [ref=f2e276]'
              - paragraph [ref=f2e277]: Copy-on-Write in action — the container copies a file from a read-only layer into its writable layer before modifying it. The original is never touched.
            - generic [ref=f2e278]:
              - status [ref=f2e280]:
                - generic [ref=f2e285]:
                  - generic [ref=f2e286]: "Cache invalidation rule:"
                  - generic [ref=f2e287]: When any layer changes, ALL layers below it are rebuilt from scratch. Put stable things first (base image, OS deps, package manifests) and frequently-changing code last.
              - status [ref=f2e289]:
                - generic [ref=f2e294]:
                  - generic [ref=f2e295]: "Secrets in layers:"
                  - generic [ref=f2e296]: If you copy a secret into an image and delete it in a later RUN step, the secret is still visible in the earlier layer. Use build args, secrets mounts, or multi-stage builds to avoid leaking credentials into image history.
