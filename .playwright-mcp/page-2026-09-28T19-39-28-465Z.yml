          - generic [ref=f2e568]:
            - generic [ref=f2e570]:
              - heading "Container Immutability" [level=2] [ref=f2e571]
              - generic "Best Practice" [ref=f2e573]
            - generic [ref=f2e574]:
              - paragraph [ref=f2e575]:
                - text: One of the most important principles in container operations is
                - strong [ref=f2e576]: immutability
                - text: ": once a container image is built, it should never be modified. If you need to update your application, you rebuild the image from scratch and deploy the new version. You do not patch the running container, you do not"
                - code [ref=f2e577]: ssh
                - text: into it and install packages, you do not edit config files in place.
              - paragraph [ref=f2e578]:
                - text: This is sometimes summarised as
                - strong [ref=f2e579]: "\"cattle, not pets\""
                - text: . In traditional operations, servers were treated like pets — individually named, carefully maintained, nursed through outages. Containers should be treated like cattle — interchangeable, identical units that are replaced rather than repaired. If a container misbehaves, you kill it and start a new one from the same image.
              - paragraph [ref=f2e580]: "Immutability has several important practical benefits. Every running container is guaranteed to be identical to every other container started from the same image — no configuration drift, no \"works on my machine\" problems. Rolling back a bad deployment means running the previous image tag, which is instant. Auditing what is in production is trivial: look at the image digest."
              - paragraph [ref=f2e581]:
                - text: Immutability does NOT mean your application cannot have persistent state. It means that state must be
                - strong [ref=f2e582]: externalised
                - text: — stored in a database, object store, or mounted volume that lives outside the container. The container itself is ephemeral. Its filesystem is thrown away when it stops. If your application needs to write data that must survive a container restart, that data must go to a volume or an external service.
            - generic [ref=f2e583]:
              - status [ref=f2e585]:
                - generic [ref=f2e590]:
                  - generic [ref=f2e591]: "Do not exec into production:"
                  - generic [ref=f2e592]: Running "docker exec -it mycontainer bash" to make changes in a running production container defeats the entire purpose of immutability. If the container is replaced, those changes vanish. Fix it in the Dockerfile and redeploy.
              - status [ref=f2e594]:
                - generic [ref=f2e599]:
                  - generic [ref=f2e600]: "Cattle, not pets:"
                  - generic [ref=f2e601]: Name your containers after their role, not their personality. If container "web-1" crashes, spin up "web-2" from the same image — do not try to repair "web-1".
            - generic [ref=f2e603]:
