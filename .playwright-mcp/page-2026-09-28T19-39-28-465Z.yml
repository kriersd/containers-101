              - paragraph [ref=f2e171]:
                - text: Container images are compiled for a specific CPU architecture. The two you will encounter most are
                - strong [ref=f2e172]: amd64
                - text: (also called x86_64 — Intel/AMD processors, most cloud VMs and data-centre servers) and
                - strong [ref=f2e173]: arm64
                - text: (also called aarch64 — Apple Silicon Macs, AWS Graviton instances, Raspberry Pi). An image built for amd64 will not run natively on arm64, and vice versa.
              - paragraph [ref=f2e174]:
                - text: This matters enormously in practice. If you build on an Apple M-series laptop and push to a Linux server running on Intel, the image will fail at runtime with a cryptic "exec format error". The solution is to always build images targeting the deployment architecture using the
                - code [ref=f2e175]: "--platform"
                - text: flag, or to create multi-architecture manifest lists that bundle both variants.
              - paragraph [ref=f2e176]:
                - text: The
                - strong [ref=f2e177]: base image OS
                - text: also matters. Your options range from a full OS like Ubuntu or Debian, to minimal variants like Alpine Linux (about 5 MB), to Red Hat Universal Base Image (UBI, fully supported for enterprise deployments), to Distroless or Scratch images that contain literally nothing except your application binary. The choice affects image size, available tooling, and your security attack surface.
              - paragraph [ref=f2e178]:
                - text: "A good rule of thumb: choose the smallest base that still ships the runtime your application needs. Alpine with"
                - code [ref=f2e179]: node:22-alpine
                - text: is a great choice for Node.js apps. UBI is the right choice when running on Red Hat OpenShift. Scratch is for statically compiled Go binaries that need no OS at all.
