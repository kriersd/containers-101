          - generic [ref=f2e510]:
            - generic [ref=f2e512]:
              - heading "Containers vs Virtual Machines" [level=2] [ref=f2e513]
              - generic "Concept" [ref=f2e515]
            - generic [ref=f2e517]:
              - img "Side-by-side architecture diagram comparing Virtual Machines (app + guest OS + hypervisor stack) with Containers (app + libs sharing a single host OS kernel via a container runtime)." [ref=f2e518]
              - paragraph [ref=f2e519]: Virtual Machines carry a full guest OS per app — containers share the host kernel directly, removing the hypervisor and guest OS overhead entirely.
            - generic [ref=f2e520]:
              - paragraph [ref=f2e521]: "Virtual Machines have been the foundation of cloud infrastructure for two decades. A hypervisor (such as VMware ESXi, KVM, or Hyper-V) creates virtualised hardware for each VM — virtual CPU, RAM, disk, network card. Each VM then runs a complete guest operating system on top of this virtual hardware. The isolation is strong: a compromised VM cannot directly access another VM's kernel."
              - paragraph [ref=f2e522]: Containers take a fundamentally different approach. There is no hypervisor, no virtualised hardware, and no guest operating system. Instead, the host kernel itself provides isolation through namespaces and cgroups. Every container on the same host shares the same kernel — they are just differently constrained views of the same running OS.
              - paragraph [ref=f2e523]: This difference has profound practical consequences. A VM must boot an entire OS, which takes 30–90 seconds and consumes hundreds of megabytes of RAM just for the OS baseline. A container starts in milliseconds because there is no OS to boot — it is just another process. You can run hundreds of containers on the same host that could only host a handful of VMs.
              - paragraph [ref=f2e524]: The trade-off is isolation depth. If there is a kernel vulnerability, it potentially affects all containers on that host. VMs provide a harder boundary because exploiting one requires breaking through the hypervisor as well. Modern container runtimes (like gVisor, Kata Containers) address this by adding a lightweight VM layer underneath containers when stronger isolation is needed.
            - status [ref=f2e527]:
              - generic [ref=f2e532]:
                - generic [ref=f2e533]: "Containers vs VMs — not either/or:"
                - generic [ref=f2e534]: In production cloud environments, containers typically run inside VMs. You get the density and speed of containers AND the isolation boundary of virtualisation. These technologies are complementary.
            - generic [ref=f2e536]:
              - paragraph [ref=f2e537]: text
              - generic [ref=f2e538]:
                - textbox "Copy to clipboard" [ref=f2e539]:
