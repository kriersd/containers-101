              - generic "Security" [ref=f2e637]
            - generic [ref=f2e638]:
              - paragraph [ref=f2e639]:
                - strong [ref=f2e640]: Docker Hub
                - text: (hub.docker.com) is the default public registry — the npm of the container world. When you run
                - code [ref=f2e641]: docker pull nginx
                - text: ", Docker contacts Docker Hub and downloads the image. It hosts millions of images contributed by vendors, open-source projects, and individual developers."
              - paragraph [ref=f2e642]:
                - text: Docker Hub has a tiered trust system.
                - strong [ref=f2e643]: Official Images
                - text: (marked with a blue badge) are curated by Docker Inc. and maintained by upstream vendors —
                - code [ref=f2e644]: nginx
                - text: ","
                - code [ref=f2e645]: node
                - text: ","
                - code [ref=f2e646]: postgres
                - text: ","
                - code [ref=f2e647]: python
                - text: are official images. They are regularly scanned for CVEs and follow consistent conventions.
                - strong [ref=f2e648]: Verified Publisher
                - text: images are from companies that have verified their identity with Docker.
                - strong [ref=f2e649]: Community images
                - text: — everything else — carry no guarantee and should be treated with significant caution.
              - paragraph [ref=f2e650]:
                - text: The risk is real. Malicious or abandoned community images can contain cryptocurrency miners, backdoors, or simply years of unpatched vulnerabilities. An image that was perfectly safe when pulled two years ago may be full of critical CVEs today. Running
                - code [ref=f2e651]: docker pull someuser/sometool:latest
                - text: without investigation is equivalent to
                - code [ref=f2e652]: curl | bash
                - text: — you are executing untrusted code with whatever privileges you give the container.
              - paragraph [ref=f2e653]:
                - text: For enterprise use, consider
                - strong [ref=f2e654]: IBM Container Registry
                - text: (icr.io),
                - strong [ref=f2e655]: Red Hat Quay
                - text: (quay.io), or your cloud provider's private registry (AWS ECR, GCP Artifact Registry, Azure ACR). These provide image scanning, role-based access control, and a private namespace for your own images. The Open Liberty image used in this repository (
                - code [ref=f2e656]: icr.io/appcafe/open-liberty
                - text: ) is pulled from IBM Container Registry.
