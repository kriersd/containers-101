            - generic [ref=f2e424]:
              - paragraph [ref=f2e425]:
                - text: A
                - strong [ref=f2e426]: Dockerfile
                - text: (or
                - code [ref=f2e427]: Containerfile
                - text: in Podman terminology — they are identical in syntax) is a plain-text recipe that describes how to build a container image. It is a sequence of instructions, each of which either modifies the filesystem or sets metadata. When you run
                - code [ref=f2e428]: docker build
                - text: ", Docker reads this file top to bottom and produces a layered image."
              - paragraph [ref=f2e429]:
                - text: "The most important instructions are:"
                - code [ref=f2e430]: FROM
                - text: (sets the base image — every Dockerfile must start here),
                - code [ref=f2e431]: RUN
                - text: (executes a shell command, produces a new layer),
                - code [ref=f2e432]: COPY
                - text: (copies files from your local machine into the image),
                - code [ref=f2e433]: WORKDIR
                - text: (sets the working directory for subsequent instructions),
                - code [ref=f2e434]: ENV
                - text: (sets environment variables baked into the image),
                - code [ref=f2e435]: ARG
                - text: (defines build-time variables passed with
                - code [ref=f2e436]: "--build-arg"
                - text: ),
                - code [ref=f2e437]: EXPOSE
                - text: (documents which port the app listens on — it does NOT publish the port),
                - code [ref=f2e438]: CMD
                - text: (the default command to run when the container starts — can be overridden),
                - code [ref=f2e439]: ENTRYPOINT
                - text: (the executable that always runs — harder to override),
                - code [ref=f2e440]: USER
                - text: (switches to a non-root user for security), and
                - code [ref=f2e441]: HEALTHCHECK
                - text: (tells Docker how to test whether the container is healthy).
              - paragraph [ref=f2e442]:
                - strong [ref=f2e443]: Multi-stage builds
                - text: are one of the most powerful Dockerfile patterns. You use multiple
                - code [ref=f2e444]: FROM
                - text: instructions, each starting a new stage. The first stage might install a full build toolchain and compile your app. The final stage copies only the compiled output into a clean minimal base image — discarding all build tools, intermediate files, and any secrets used during compilation. This keeps the production image small and secure.
              - paragraph [ref=f2e445]: "The Dockerfile in this repository is a real multi-stage example: Stage 1 uses a full Maven JDK image to compile the Java backend; Stage 2 uses Node.js to build the React frontend; Stage 3 copies both compiled artefacts into a minimal Open Liberty runtime image and runs as a non-root user. Nothing from the build stages makes it into the final image except the compiled code."
