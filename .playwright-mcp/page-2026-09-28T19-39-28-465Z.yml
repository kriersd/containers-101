            - generic [ref=f2e114]:
              - paragraph [ref=f2e115]:
                - text: A
                - strong [ref=f2e116]: container
                - text: "is a standard unit of software that packages code and all its dependencies — libraries, runtime, configuration — so the application runs quickly and reliably across different computing environments. Think of it like a shipping container: a standardised steel box that can be loaded onto any ship, train, or truck regardless of what is inside."
              - paragraph [ref=f2e117]: Containers share the host machine's operating system kernel rather than each carrying a full OS. This makes them dramatically lighter than virtual machines — a container typically starts in milliseconds and consumes megabytes of memory instead of gigabytes.
              - paragraph [ref=f2e118]:
                - text: "There are two closely related terms you will use constantly: an"
                - strong [ref=f2e119]: image
                - text: is the static, read-only blueprint that describes everything needed to run your application. A
                - strong [ref=f2e120]: container
                - text: is the running instance of that image — like the difference between a class definition and an object in a programming language.
              - paragraph [ref=f2e121]:
                - text: "Under the hood, a container is just a normal Linux process that is isolated from everything else using two kernel features:"
                - strong [ref=f2e122]: namespaces
                - text: (which give the process its own view of the filesystem, network, and process table) and
                - strong [ref=f2e123]: control groups (cgroups)
                - text: (which limit how much CPU and memory it can consume). There is no virtualisation hardware involved — the container shares the real kernel.
